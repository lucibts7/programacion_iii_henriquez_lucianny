<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Elementos</title>
    <script src="02_seleccion_mp_henriquez_lucianny.js" defer></script>
</head>
<body>
    <p id="estacionamiento">Estacionamiento Digital</p>
    <p id="espacios">Espacios disponibles: 0</p>
    <p id="estado">Estacionamiento: Cerrado</p>

    <h1>Selección con Class</h1>
    <p class="vehiculo">Automóvil</p>
    <p class="vehiculo">Motocicleta</p>
    <p class="vehiculo">Camioneta</p>

    <h2>Pendiente</h2>
    <h3 id="pendiente">Pendiente</h3>

    <div id="registrado">
        <p class="estado">No registrado</p>
    </div>

    <h1>Tipos de Vehículos</h1>
    <p class="tipos">Automóvil</p>
    <p class="tipos">Motocicleta</p>
    <p class="tipos">Camioneta</p>
    <p class="tipos">Bicicleta</p>
    <p class="tipos">Bus</p>
    <p class="tipos">Camión</p>
</body>
</html>
